<style>
/* Layout: book index rail on wide screens (iPad landscape), single reading column ~65ch with an ink layer for Apple Pencil, sticky toolbar, sheets for study/search/saved/settings. */
:root {

  --accent-soft: #f2e8d5;
  --hl-gold: #ffe14d;
  --hl-sage: #8fe388;
  --hl-sky: #86cbff;
  --hl-rose: #ff9cc6;
  --pen-ink: #1c2231;
  --pen-red: #b3261e;
  --pen-blue: #1f5fbf;
  --pen-gold: #8d6118;
  --danger: #a3312b;
  --shadow: 0 10px 40px rgba(20, 28, 45, .16);
  --f-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-text: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --size: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141c; --surface: #171c27; --ink: #e7e4db; --muted: #9ba2b1; --line: #2a3141;
    --accent: #d8ad63; --accent-soft: #2d2719;
    --hl-gold: #8f6f00; --hl-sage: #1d7a35; --hl-sky: #0b6aa8; --hl-rose: #a3245e;
    --pen-ink: #e7e4db; --pen-red: #ff8a80; --pen-blue: #8ab4f8; --pen-gold: #d8ad63; --danger: #ff8a80;
    --shadow: 0 10px 40px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141c; --surface: #171c27; --ink: #e7e4db; --muted: #9ba2b1; --line: #2a3141;
  --accent: #d8ad63; --accent-soft: #2d2719;
  --hl-gold: #8f6f00; --hl-sage: #1d7a35; --hl-sky: #0b6aa8; --hl-rose: #a3245e;
  --pen-ink: #e7e4db; --pen-red: #ff8a80; --pen-blue: #8ab4f8; --pen-gold: #d8ad63; --danger: #ff8a80;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }
svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { display: grid; grid-template-columns: 1fr; min-height: 100%; }
@media (min-width: 1000px) { .app { grid-template-columns: 300px 1fr; } }

/* Book index */
.rail { display: none; border-right: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; padding-block: 16px 40px; }

.index-head { display: grid; gap: 4px; padding: 4px 6px 14px; }
.wordmark { font-family: var(--f-display); font-weight: 600; letter-spacing: .14em; font-size: 15px; color: var(--accent); }
.progress { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.daily span { font-family: var(--f-text); font-size: 14.5px; line-height: 1.5; }

.testament { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 14px 6px 6px; }
.book-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 7px 8px; border-radius: 8px; text-align: left; font-size: 15px; }
.book-btn:hover { background: var(--bg); }
.book-btn.current { color: var(--accent); font-weight: 600; }
.book-btn em { font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 5px; padding: 4px 4px 12px; }
.chap-grid button { height: 38px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
.chap-grid button.read { background: var(--accent-soft); border-color: transparent; }
.chap-grid button.current { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }

/* Toolbar */
main { min-width: 0; display: flex; flex-direction: column; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 2px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
.icon-btn:hover { background: var(--bg); color: var(--ink); }

.icon-btn:disabled { opacity: .35; }
.where { display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 44px; border-radius: 10px; font-family: var(--f-display); font-weight: 600; letter-spacing: .06em; font-size: 16px; min-width: 0; }
.where span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where svg { width: 16px; height: 16px; color: var(--muted); }
.where:hover { background: var(--bg); }
.spacer { flex: 1; }

/* Reader */
.reader { width: 100%; max-width: calc(34em + 32px); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 36px 120px; font-size: var(--size); flex: 1; }
.ch-head { text-align: center; display: grid; gap: 6px; margin-bottom: 1.6em; font-size: 16px; }
.ch-head p { font-family: var(--f-ui); font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
.ch-head h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(28px, 2.4em, 44px); letter-spacing: .08em; margin: 0; text-wrap: balance; line-height: 1.15; }
.ch-head .rule { width: 56px; height: 1px; background: var(--accent); margin: 8px auto 4px; }
.ch-head a { font-size: 13px; font-weight: 500; text-decoration: none; }
.ch-head a:hover { text-decoration: underline; }
.text-wrap { position: relative; }
#ink { position: absolute; left: 0; top: 0; pointer-events: none; }
#inkLive { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 15; }
.pencil-on .text-wrap { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: crosshair; }
.text { font-family: var(--f-text); line-height: 1.8; hyphens: auto; -webkit-hyphens: auto; }
.text .drop { float: left; font-family: var(--f-display); font-weight: 600; color: var(--accent); font-size: 3.3em; line-height: .9; padding: .06em .14em 0 0; }
.v { border-radius: 4px; cursor: pointer; transition: background .15s; }
.v sup { font-family: var(--f-ui); font-size: .56em; font-weight: 600; color: var(--accent); vertical-align: .55em; line-height: 0; margin-right: .2em; font-variant-numeric: tabular-nums; }
.lines .v { display: block; margin-bottom: .5em; padding: 0 .15em; }
mark.h { color: inherit; border-radius: 3px; padding: .08em 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.h-gold { background: var(--hl-gold); } .h-sage { background: var(--hl-sage); } .h-sky { background: var(--hl-sky); } .h-rose { background: var(--hl-rose); }
.v.sel .t { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: .25em; }
.v.mark sup::before { content: ""; display: inline-block; width: .55em; height: .7em; margin-right: .2em; background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%); vertical-align: -.05em; }
.pin { display: inline-grid; place-items: center; width: 1.4em; height: 1.2em; vertical-align: -.15em; color: var(--accent); border-radius: 4px; }
.pin svg { width: .9em; height: .9em; }
.v.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: var(--accent-soft); } 100% { background: transparent; } }
.no-nums .v sup { display: none; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 2.4em; font-family: var(--f-ui); font-size: 15px; }
.pager button { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; text-align: left; background: var(--surface); }
.pager button:last-child { text-align: right; }

.pager button:disabled { visibility: hidden; }
.loading { text-align: center; color: var(--muted); font-family: var(--f-text); font-style: italic; padding-top: 20vh; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .38); z-index: 40; }
.sheet { position: fixed; z-index: 50; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; inset: auto 0 0 0; max-height: 88vh; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 700px) { .sheet { inset: calc(env(safe-area-inset-top, 0px) + 64px) auto auto 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 48px)); max-height: calc(100vh - 100px); border-radius: 18px; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-size: 16px; letter-spacing: .1em; font-weight: 600; flex: 1; min-width: 0; }
.sheet-body { overflow-y: auto; padding: 8px 20px 28px; -webkit-overflow-scrolling: touch; }
.seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 7px 12px; border-radius: 8px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.search-box { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--bg); margin: 8px 0 10px; }
.search-box input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 17px; padding: 12px 0; color: var(--ink); outline: none; }
.hint { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 10px 0; }
.result { display: grid; gap: 3px; padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.result b { font-size: 12.5px; color: var(--accent); font-weight: 600; letter-spacing: .02em; }
.result span { font-family: var(--f-text); font-size: 15.5px; line-height: 1.55; }
.result em { font-style: normal; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.result mark { background: var(--hl-gold); color: inherit; border-radius: 2px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; letter-spacing: .02em; }
.goto { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-weight: 600; margin-bottom: 6px; }
.goto svg { color: var(--accent); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.row label { font-weight: 500; }
.row input[type=range] { width: min(260px, 100%); accent-color: var(--accent); }
.sample { font-family: var(--f-text); line-height: 1.7; color: var(--muted); padding: 14px 0 4px; }
.empty { text-align: center; padding: 34px 10px; color: var(--muted); line-height: 1.6; }
.empty strong { display: block; color: var(--ink); font-family: var(--f-display); letter-spacing: .08em; margin-bottom: 4px; }
.about { font-size: 12.5px; color: var(--muted); line-height: 1.55; padding-top: 16px; }

/* Study panel */
.quote { font-family: var(--f-text); font-size: 18px; line-height: 1.65; margin: 14px 0 6px; padding: 4px 0 4px 16px; border-left: 3px solid var(--accent); }

.expanded { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; }
.word b { font-family: var(--f-ui); font-weight: 600; }
.word i { color: var(--muted); }

.byline { font-size: 12px; color: var(--muted); }
.field { display: grid; gap: 6px; margin-top: 18px; }
.field label { font-weight: 600; font-size: 13.5px; }
.field small { color: var(--muted); font-size: 12.5px; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 12px; font-weight: 600; background: var(--accent); color: var(--surface); }
.btn.quiet { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: none; color: var(--danger); border: 1px solid var(--line); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.colors { display: inline-flex; gap: 6px; }
.colors button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); }
.colors button[aria-pressed="true"] { border-color: var(--ink); }

/* Plan */
.plan-head { display: grid; gap: 6px; padding: 12px 0 4px; }

.plan-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 0; }
.plan-row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.tick { width: 44px; height: 48px; display: grid; place-items: center; flex: none; }
.reading { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; padding: 12px 4px; text-align: left; font-size: 16px; font-weight: 500; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.check svg { width: 14px; height: 14px; stroke-width: 3; opacity: 0; }

.plan-row.done .reading span { color: var(--muted); }
.reading span { flex: 1; }
.reading em { font-style: normal; color: var(--muted); font-size: 13px; font-weight: 400; }

/* Floating bars */
.floatbar { position: fixed; z-index: 35; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); border-radius: 16px; padding: 6px; display: flex; align-items: center; gap: 2px; max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; }
.floatbar .ref { font-weight: 600; font-size: 13.5px; padding: 0 8px; color: var(--accent); white-space: nowrap; }

.sw-gold { background: var(--hl-gold); } .sw-sage { background: var(--hl-sage); } .sw-sky { background: var(--hl-sky); } .sw-rose { background: var(--hl-rose); }
.sw-ink { background: var(--pen-ink); } .sw-red { background: var(--pen-red); } .sw-blue { background: var(--pen-blue); } .sw-pgold { background: var(--pen-gold); }
.floatbar .sep { width: 1px; height: 26px; background: var(--line); margin: 0 4px; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 66px); background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px); }

.toast button[hidden] { display: none; }
.toast:not(:has(button:not([hidden]))) { padding-right: 16px; }
/* Pen options and handwriting pads */
.palette { flex-direction: column; align-items: stretch; gap: 4px; }
.prow { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: center; }
.penopts { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.pen-style { font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sizes { display: inline-flex; gap: 2px; }
.size { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; }
.size i { display: block; border-radius: 50%; background: var(--ink); }
.size[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.pcolors { display: inline-flex; }
.pcolors .swatch { width: 30px; height: 30px; }
.field-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.field-head label { font-weight: 600; font-size: 13.5px; }
.pad-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0 8px; }
.pad-actions { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
.btn.small { padding: 7px 12px; font-size: 13.5px; }
.pad { position: relative; height: 260px; border: 1px solid var(--line); border-radius: 12px; background-color: var(--surface); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--line) 35px, var(--line) 36px); background-position: 0 14px; overflow: hidden; cursor: crosshair; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.pad canvas { position: absolute; left: 0; top: 0; }
.plan-pick { margin: 6px 0 2px; }
.day-title { font-family: var(--f-text); font-size: 17px; font-style: italic; color: var(--ink); }
.bookcard { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; margin-top: 18px; }
.bookcard h3 { margin: 0; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.bookcard dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
.bookcard dt { color: var(--muted); font-weight: 600; }
.bookcard dd { margin: 0; }
.bookcard p { margin: 0; font-family: var(--f-text); font-size: 15.5px; line-height: 1.6; }
@media (prefers-reduced-motion: reduce) { .v, .v.flash { transition: none; animation: none; } .thinking i { animation: none; } }
</style>

</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Books of the Bible"></aside>
  <main>
    <header class="bar">
      <button class="icon-btn only-narrow" id="btnBooks" aria-label="Books and chapters"><svg viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5C4.7 20 4 19.3 4 18.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg></button>
      <button class="where" id="btnWhere" aria-label="Choose book and chapter"><span id="whereText">Holy Bible</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="spacer"></div>
      <button class="icon-btn only-wide" id="btnPrev" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="icon-btn only-wide" id="btnNext" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="icon-btn" id="btnToday" aria-label="Daily study plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/></svg></button>
      <button class="icon-btn" id="btnPencil" aria-label="Write with Apple Pencil" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L8 20H4v-4z"/><path d="m13.5 6.5 4 4"/></svg></button>
      <button class="icon-btn" id="btnSearch" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
      <button class="icon-btn" id="btnSaved" aria-label="My highlights, notes and bookmarks"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg></button>
      <button class="icon-btn" id="btnSettings" aria-label="Text settings"><svg viewBox="0 0 24 24"><path d="M3 19 8 6l5 13M4.8 14.5h6.4"/><path d="M14.5 19l3-8 3 8M15.4 16.7h4.2"/></svg></button>
    </header>
    <article class="reader" id="reader"><p class="loading">Opening the Bible…</p></article>
  </main>
</div>

<canvas id="inkLive" aria-hidden="true"></canvas>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><div id="sheetTools"></div><button class="icon-btn" id="btnClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="floatbar" id="actions" hidden>
  <span class="ref" id="selRef"></span>
  <button class="swatch sw-gold" data-hl="gold" aria-label="Highlight gold"></button>
  <button class="swatch sw-sage" data-hl="sage" aria-label="Highlight green"></button>
  <button class="swatch sw-sky" data-hl="sky" aria-label="Highlight blue"></button>
  <button class="swatch sw-rose" data-hl="rose" aria-label="Highlight pink"></button>
  <button class="icon-btn" data-hl="" aria-label="Remove highlight"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m6.5 6.5 11 11"/></svg></button>
  <span class="sep"></span>
  <button class="icon-btn" id="actNote" aria-label="Add a note"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg></button>
  <button class="icon-btn" id="actMark" aria-label="Bookmark"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg></button>
  <button class="icon-btn" id="actCopy" aria-label="Copy verses"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></svg></button>
  <button class="icon-btn" id="actDone" aria-label="Done"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<div class="floatbar palette" id="palette" hidden>
  <div class="prow">
    <button class="icon-btn" data-tool="pen" aria-label="Pen" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L8 20H4v-4z"/></svg></button>
    <button class="icon-btn" data-tool="hl" aria-label="Highlighter" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m9 15-3 3h5l1-1"/><path d="m9 15 8.5-8.5a2.1 2.1 0 0 1 3 3L12 18z"/><path d="M4 21h16"/></svg></button>
    <button class="icon-btn" data-tool="eraser" aria-label="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="m4.6 14.6 9.9-9.9a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18H8z"/><path d="m9 10 5 5"/></svg></button>
    <span class="sep"></span>
    <span id="palColors" style="display:flex"></span>
    <button class="icon-btn" id="palUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="icon-btn" id="palOff" aria-label="Stop writing"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="prow" id="palPen"></div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="toastBtn" hidden></button></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let colorCache = {};
  const colorOf = (n) => colorCache[n] || (colorCache[n] = cssVar(n));
  const ICON_CHECK = `<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>`;
  const ICON_UNDO = `<svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>`;
  const ICON_NOTE = `<svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg>`;

  let BOOKS = null, TOTAL_CH = 0, FLAT = null, OT = [], NT = [];
  const DATA = { state: null, ch: {}, study: {} };
  let S = null;                      // DATA.state
  let sel = new Set(), openBook = null, sheetMode = null, scope = "all";
  let tool = "pen", hlColor = "gold";
  let studyTarget = null, planDay = 1;
  const pendingCtx = new Set(), pendingGuide = new Set();
  const undo = {};                   // chapter id -> actions

  const DEFAULT_STATE = () => ({ pos: { b: 18, c: 22 }, marks: [], read: {}, prefs: { size: 20, layout: "lines", nums: true, theme: "auto", pencil: false, penStyle: "ball", penSize: 1, penColor: "ink" }, plans: {}, activePlan: "year" });
  const DAILY = [[18,22,0],[42,2,15],[22,39,30],[49,3,12],[44,7,27],[19,2,4],[23,28,10],[18,45,0],[39,10,27],[45,12,3],[42,13,26],[44,11,1],[48,1,7],[49,3,5],[57,10,0],[42,9,10],[18,90,0],[22,40,9],[5,0,8],[42,10,24],[44,14,12],[46,4,16],[58,0,4],[61,3,7],[39,5,32],[18,118,104],[22,25,2],[39,5,13],[32,5,7],[24,2,21],[47,5,8]];
  const label = (b, c) => (b === 18 ? "Psalm" : BOOKS[b][0]) + " " + (c + 1);
  const key = (b, c, v) => b + "." + c + "." + v;
  const chId = (b, c) => b + "-" + c;
  const verseText = (b, c, v) => (BOOKS[b] && BOOKS[b][1][c] && BOOKS[b][1][c][v - 1]) || "";
  const ampUrl = (ref) => "https://www.biblegateway.com/passage/?search=" + encodeURIComponent(ref) + "&version=AMP";

  // ---------- Storage: Claude account (db) when available, else this device ----------
  const local = {
    get(k) { try { const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
    keys(prefix) { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix)) out.push(k); } } catch (e) {} return out; },
  };
  let BASE = null, SAMPLE = null, syncMode = "device";

  async function initCapabilities() {
    const cl = window.claude;
    if (!cl || typeof cl.use !== "function") return;
    try {
      const [db, user, sample] = await Promise.all([cl.use("db"), cl.use("user"), cl.use("sample")]);
      SAMPLE = sample || null;
      const uid = user ? await user.id() : null;
      if (db && uid) { BASE = db.doc("data/users/" + uid + "/state"); syncMode = "account"; }
    } catch (e) {}
  }

  async function loadData() {
    if (BASE) {
      try {
        const [st, chs] = await Promise.all([BASE.get(), BASE.collection("ch").limit(1000).get()]);
        DATA.state = st.exists ? clone(st.data()) : null;
        chs.docs.forEach((d) => { if (d.exists) DATA.ch[d.id] = clone(d.data()); });
      } catch (e) { BASE = null; syncMode = "device"; }
    }
    if (!BASE) {
      DATA.state = local.get("kjv2.state");
      local.keys("kjv2.ch.").forEach((k) => { const v = local.get(k); if (v) DATA.ch[k.slice(8)] = v; });
    }
    if (!DATA.state) { DATA.state = migrateV1() || DEFAULT_STATE(); save("state"); }
    S = DATA.state;
    const d = DEFAULT_STATE();
    S.prefs = Object.assign(d.prefs, S.prefs || {});
    S.plans = S.plans || {};
    if (S.plan) { if (!S.plans.year) S.plans.year = S.plan; delete S.plan; }
    S.activePlan = S.activePlan || "year";
    S.marks = S.marks || []; S.read = S.read || {};
    if (!S.pos || !BOOKS[S.pos.b] || !BOOKS[S.pos.b][1][S.pos.c]) S.pos = d.pos;
  }

  function migrateV1() {
    const pos = local.get("kjv.pos"); if (!pos) return null;
    const st = DEFAULT_STATE();
    st.pos = pos; st.marks = local.get("kjv.marks") || []; st.read = local.get("kjv.read") || {};
    Object.assign(st.prefs, local.get("kjv.prefs") || {});
    Object.entries(local.get("kjv.hls") || {}).forEach(([k, c]) => {
      const [b, ch, v] = k.split(".").map(Number), t = verseText(b, ch, v); if (!t) return;
      chData(b, ch, true).hl.push({ id: newId(), v1: v, o1: 0, v2: v, o2: t.length, c, t: Date.now() });
      save("ch", chId(b, ch));
    });
    return st;
  }

  function chData(b, c, create) {
    const id = chId(b, c);
    if (!DATA.ch[id] && create) DATA.ch[id] = { hl: [], notes: {}, ink: [] };
    const d = DATA.ch[id];
    if (d) { d.hl = d.hl || []; d.notes = d.notes || {}; d.ink = d.ink || []; }
    return d;
  }
  const isEmptyCh = (d) => !d || (!d.hl.length && !Object.keys(d.notes).length && !d.ink.length);

  const timers = {}, busy = {}, again = {}, retries = {};
  function save(kind, id) {
    const k = kind + "|" + (id || "");
    clearTimeout(timers[k]); timers[k] = setTimeout(() => flush(k), 700);
  }
  function flushAll() { Object.keys(timers).forEach((k) => { clearTimeout(timers[k]); flush(k); }); }
  async function flush(k) {
    delete timers[k];
    if (busy[k]) { again[k] = true; return; }
    busy[k] = true;
    const [kind, id] = k.split("|");
    const data = kind === "state" ? DATA.state : kind === "ch" ? DATA.ch[id] : DATA.study[id];
    const empty = !data || (kind === "ch" && isEmptyCh(data));
    try {
      const json = empty ? null : JSON.stringify(data);
      if (json && json.length > 250000) throw { code: "too_big" };
      if (BASE) {
        const ref = kind === "state" ? BASE : BASE.collection(kind).doc(id);
        if (empty) await ref.delete(); else await ref.set(JSON.parse(json));
      } else {
        const lk = kind === "state" ? "kjv2.state" : "kjv2." + kind + "." + id;
        if (empty) local.del(lk); else if (!local.set(lk, data)) throw { code: "device_full" };
      }
      retries[k] = 0;
    } catch (e) {
      const code = e && e.code;
      if (code === "too_big") toast("This chapter has too much handwriting to save. Erase a little to make room.");
      else if (code === "device_full") toast("This device has run out of room for notes.");
      else if (code === "quota_exceeded") toast("Your notes storage is full. Erase some handwriting to make room.");
      else if (BASE && (code === "invalid_argument" || code === "revoked" || code === "not_granted")) {
        BASE = null; syncMode = "device";
        toast("Couldn't save to your account, so notes are now saved on this device.");
        Object.keys(DATA.ch).forEach((cid) => save("ch", cid)); Object.keys(DATA.study).forEach((sid) => save("study", sid)); save("state");
      } else if ((retries[k] = (retries[k] || 0) + 1) <= 3) setTimeout(() => save(kind, id), 2000 + Math.random() * 2000);
      else toast("Couldn't save just now. Your next change will try again.");
    }
    busy[k] = false;
    if (again[k]) { again[k] = false; flush(k); }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });
  window.addEventListener("pagehide", flushAll);

  function applyTheme() {
    const r = document.documentElement;
    if (S.prefs.theme === "auto") { if (r.dataset.ours) { r.removeAttribute("data-theme"); delete r.dataset.ours; } }
    else { r.dataset.theme = S.prefs.theme; r.dataset.ours = "1"; }
    r.style.setProperty("--size", S.prefs.size + "px");
    colorCache = {};
    document.body.classList.toggle("pencil-on", !!S.prefs.pencil);
    $("#btnPencil").setAttribute("aria-pressed", !!S.prefs.pencil);
    updateBars();
  }

  // ---------- Book index ----------
  function indexHTML() {
    const done = Object.keys(S.read).length;
    const [db, dc, dv] = DAILY[Math.floor(Date.now() / 864e5) % DAILY.length];
    let h = `<div class="index-head"><div class="wordmark">HOLY BIBLE · KJV</div>
      <div class="progress">${done.toLocaleString()} of ${TOTAL_CH.toLocaleString()} chapters read</div>
      <div class="progress-bar"><i style="width:${(done / TOTAL_CH * 100).toFixed(2)}%"></i></div></div>
      <button class="daily" data-go="${db}.${dc}.${dv + 1}"><small>Verse for today</small><span>${esc(BOOKS[db][1][dc][dv])}</span><b>${label(db, dc)}:${dv + 1}</b></button>`;
    BOOKS.forEach(([name, chs], b) => {
      if (b === 0) h += `<div class="testament">Old Testament</div>`;
      if (b === 39) h += `<div class="testament">New Testament</div>`;
      h += `<button class="book-btn${b === S.pos.b ? " current" : ""}" data-book="${b}" aria-expanded="${openBook === b}">${esc(name)}<em>${chs.length}</em></button>`;
      if (openBook === b) {
        h += `<div class="chap-grid">` + chs.map((_, c) =>
          `<button data-go="${b}.${c}" class="${b === S.pos.b && c === S.pos.c ? "current" : S.read[b + "." + c] ? "read" : ""}">${c + 1}</button>`).join("") + `</div>`;
      }
    });
    return h;
  }
  function renderRail() { $("#rail").innerHTML = indexHTML(); }
  function onIndexClick(e) {
    const bk = e.target.closest("[data-book]");
    if (bk) {
      const b = +bk.dataset.book;
      if (BOOKS[b][1].length === 1) { go(b, 0); return; }
      openBook = openBook === b ? null : b;
      const container = e.currentTarget, top = bk.offsetTop - container.scrollTop;
      container.innerHTML = indexHTML();
      const nb = container.querySelector(`[data-book="${b}"]`); if (nb) container.scrollTop = nb.offsetTop - top;
      return;
    }
    const g = e.target.closest("[data-go]");
    if (g) { const [b, c, v] = g.dataset.go.split(".").map(Number); go(b, c, v); }
  }
  $("#rail").addEventListener("click", onIndexClick);

  // ---------- Reader ----------
  function verseInner(text, v, d) {
    const rs = d ? d.hl.filter((h) => v >= h.v1 && v <= h.v2).map((h) => [h.v1 === v ? h.o1 : 0, h.v2 === v ? h.o2 : text.length, h]) : [];
    if (!rs.length) return esc(text);
    const cuts = new Set([0, text.length]);
    rs.forEach(([s, e]) => { cuts.add(Math.max(0, Math.min(s, text.length))); cuts.add(Math.max(0, Math.min(e, text.length))); });
    const pts = [...cuts].sort((a, b) => a - b);
    let out = "";
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], z = pts[i + 1], seg = esc(text.slice(a, z));
      let top = null; rs.forEach((r) => { if (r[0] <= a && r[1] >= z) top = r[2]; });
      out += top ? `<mark class="h h-${top.c}" data-h="${top.id}">${seg}</mark>` : seg;
    }
    return out;
  }
  function render() {
    const { b, c } = S.pos, [name, chs] = BOOKS[b], verses = chs[c], d = chData(b, c);
    const heading = chs.length === 1 ? name : label(b, c);
    let h = `<header class="ch-head"><p>${b < 39 ? "Old" : "New"} Testament · ${esc(name)}</p><h1>${esc(heading)}</h1><div class="rule"></div>
      <a href="${ampUrl(label(b, c))}" target="_blank" rel="noopener">Read this chapter in the Amplified Bible ↗</a></header>`;
    h += `<div class="text-wrap" id="wrap"><div class="text ${S.prefs.layout}${S.prefs.nums ? "" : " no-nums"}">`;
    if (S.prefs.layout === "flow") h += `<span class="drop" aria-hidden="true">${c + 1}</span>`;
    h += verses.map((t, i) => {
      const v = i + 1, cls = ["v"];
      if (S.marks.includes(key(b, c, v))) cls.push("mark");
      if (sel.has(v)) cls.push("sel");
      const note = d && d.notes[v] ? ` <button class="pin" data-note="${v}" aria-label="Your note on verse ${v}">${ICON_NOTE}</button>` : "";
      return `<span class="${cls.join(" ")}" id="v${v}" data-v="${v}"><sup>${v}</sup><span class="t">${verseInner(t, v, d)}</span>${note}</span>`;
    }).join(S.prefs.layout === "flow" ? " " : "");
    h += `</div><canvas id="ink" aria-hidden="true"></canvas></div>`;
    const prev = step(-1), next = step(1);
    h += `<nav class="pager"><button id="pPrev" ${prev ? "" : "disabled"}><small>Previous</small>${prev ? esc(label(prev.b, prev.c)) : ""}</button>
      <button id="pNext" ${next ? "" : "disabled"}><small>Next</small>${next ? esc(label(next.b, next.c)) : ""}</button></nav>`;
    $("#reader").innerHTML = h;
    $("#whereText").textContent = heading;
    $("#btnPrev").disabled = !prev; $("#btnNext").disabled = !next;
    document.title = heading + " · Holy Bible KJV";
    requestAnimationFrame(redrawInk);
  }
  function step(dir) {
    let b = S.pos.b, c = S.pos.c + dir;
    if (c < 0) { b--; if (b < 0) return null; c = BOOKS[b][1].length - 1; }
    else if (c >= BOOKS[b][1].length) { b++; if (b >= BOOKS.length) return null; c = 0; }
    return { b, c };
  }
  function go(b, c, v) {
    S.pos = { b, c }; S.read[b + "." + c] = 1; save("state");
    openBook = b; sel.clear(); updateBars(); closeSheet();
    render(); renderRail();
    if (v) { const el = document.getElementById("v" + v); if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); } }
    else window.scrollTo(0, 0);
    const cur = $("#rail .book-btn.current"); if (cur) $("#rail").scrollTop = cur.offsetTop - 80;
  }
  function move(dir) { const s = step(dir); if (s) go(s.b, s.c); }

  let suppressClick = false;
  function onReaderTap(target) {
    if (target.closest("#pPrev")) return move(-1);
    if (target.closest("#pNext")) return move(1);
    if (target.closest("a")) return;
    const pin = target.closest("[data-note]"); if (pin) return openNote(+pin.dataset.note);
    const m = target.closest("mark[data-h]"); if (m && !sel.size) return openStudy(chId(S.pos.b, S.pos.c), m.dataset.h);
    const v = target.closest(".v"); if (!v) return;
    const n = +v.dataset.v;
    sel.has(n) ? sel.delete(n) : sel.add(n);
    v.classList.toggle("sel", sel.has(n));
    updateBars();
  }
  $("#reader").addEventListener("click", (e) => {
    if (suppressClick) return;
    if (window.getSelection && String(window.getSelection()).length) return;
    onReaderTap(e.target);

    ["Unknown; draws on records of Samuel, Nathan and Gad", "After 930 BC", "Israel's move from judges to kings, about 1100–1010 BC. Samuel, the last judge and a prophet, anoints Saul, whose disobedience costs him the kingdom, and then David, who rises through his faith while Saul pursues him."],
    ["Unknown; draws on records of Nathan and Gad", "After 930 BC", "David's 40-year reign, about 1010–970 BC: Jerusalem made the capital, God's covenant promising David an everlasting throne, and David's sin with Bathsheba and the family troubles that followed. It shows both God's grace and the cost of sin."],
    ["Unknown; Jewish tradition names Jeremiah", "c. 560–540 BC, during the exile", "From Solomon's glory and the building of the temple (about 970 BC) to the nation splitting into Israel and Judah. Written for exiles in Babylon, it explains that their disaster came from the kings' unfaithfulness, and includes the prophets Elijah and Elisha."],
    ["Unknown; Jewish tradition names Jeremiah", "c. 560–540 BC, during the exile", "Continues the divided kingdom until Assyria destroyed Israel (722 BC) and Babylon destroyed Jerusalem and the temple (586 BC). It shows God's patience through many prophets and the judgement that came when the people would not turn back."],
    ["Traditionally Ezra", "c. 450–400 BC, after the return from exile", "Retells Israel's history from Adam to David for Jews rebuilding after the exile. It focuses on David's line, the temple and true worship, reminding a small, discouraged community that they still belonged to God's purposes."],
    ["Traditionally Ezra", "c. 450–400 BC", "Covers Solomon and the kings of Judah to the exile, then Cyrus's decree allowing the return. It highlights kings who sought God and brought revival, encouraging the returned exiles to seek the Lord and worship him faithfully."],
    ["Ezra, a priest and scribe", "c. 440 BC", "The first returns from Babylon after Persia's King Cyrus allowed the Jews home in 538 BC: rebuilding the temple despite opposition, and Ezra's later mission (458 BC) to teach God's law and call the people back from intermarriage with idol worshippers."],
    ["Nehemiah, cupbearer to the Persian king", "c. 430 BC", "In 445 BC Nehemiah led the rebuilding of Jerusalem's ruined walls in 52 days despite threats and ridicule. With Ezra he read the law to the people and led them to renew the covenant. A model of prayerful, practical leadership."],
    ["Unknown", "c. 470–400 BC", "Set in the Persian capital Susa under King Xerxes (Ahasuerus) about 483–473 BC, among Jews who stayed in exile. Esther, a Jewish queen, risks her life to stop Haman's plot to destroy her people. God is never named, but his hidden providence runs through every event."],
    ["Unknown", "Uncertain; the setting is the age of the patriarchs", "A righteous man loses his wealth, children and health. Through long debates with friends who insist suffering must be punishment, the book wrestles with why the innocent suffer, ending when God speaks from the whirlwind and Job bows before his wisdom."],
    ["David (73 psalms), Asaph, the sons of Korah, Solomon, Moses and others", "c. 1440–450 BC", "Israel's songbook and prayer book, gathered over a thousand years and used in temple worship. The psalms cover praise, lament, thanksgiving, confession, wisdom and royal hope, and many look ahead to the Messiah."],
    ["Mainly Solomon, with Agur, Lemuel and others", "c. 970–700 BC; collected in Hezekiah's time", "Practical wisdom for daily life, much of it addressed by a father to his son. Built on the fear of the Lord, it speaks to work, money, speech, friendship, sexual faithfulness and character in short, memorable sayings."],
    ["Traditionally Solomon (\"the Preacher\")", "c. 935 BC on the traditional view", "A wise king's search for meaning \"under the sun\" through pleasure, work, wealth and learning, which all prove fleeting. He concludes that life is God's gift to enjoy, and that the whole duty of man is to fear God and keep his commandments."],
    ["Traditionally Solomon", "c. 960 BC on the traditional view", "A love poem celebrating the love between a bride and bridegroom and the goodness of married love. Jewish and Christian readers have also long seen in it a picture of God's love for his people and Christ's love for the church."],
    ["Isaiah, son of Amoz", "c. 740–680 BC", "Isaiah prophesied in Jerusalem under four kings of Judah while Assyria threatened the region. He warned of judgement, called Judah to trust God rather than foreign alliances, and gave the fullest Old Testament pictures of the coming Messiah and Suffering Servant."],
    ["Jeremiah, with his scribe Baruch", "c. 627–580 BC", "The \"weeping prophet\" spoke for 40 years as Babylon rose. He warned Judah of coming destruction, was persecuted for it, and saw Jerusalem fall in 586 BC, yet he also promised a new covenant written on the heart."],
    ["Traditionally Jeremiah", "Soon after 586 BC", "Five poems of grief over Jerusalem's destruction by Babylon, the burned temple and the starving people. At its centre the book turns to hope: the Lord's mercies are new every morning and great is his faithfulness."],
    ["Ezekiel, a priest", "c. 593–570 BC", "Taken to Babylon with the exiles in 597 BC, Ezekiel received dramatic visions. He explained why Jerusalem must fall, then after its fall promised a new heart, dry bones brought to life, and God's glory returning to a renewed temple."],
    ["Daniel", "c. 530 BC (many scholars date its final form later)", "Daniel was taken to Babylon as a youth in 605 BC and served in the courts of Babylon and Persia. Stories of faithfulness under pressure (the fiery furnace, the lions' den) are followed by visions that show God ruling over the rise and fall of empires."],
    ["Hosea", "c. 755–715 BC", "Prophesied to the northern kingdom of Israel in its last decades before Assyria destroyed it. God told Hosea to marry Gomer, who was unfaithful, as a living picture of Israel's spiritual adultery and of God's persistent, redeeming love."],
    ["Joel", "Uncertain; possibly c. 835 BC or after the exile", "A devastating locust plague becomes a warning of the coming \"day of the Lord\" and a call to return to God with the whole heart. It promises that God will pour out his Spirit on all people, which Peter quotes at Pentecost."],
    ["Amos, a shepherd from Tekoa", "c. 760–750 BC", "A farmer from Judah sent to prosperous northern Israel under Jeroboam II. He condemned luxury built on injustice and empty religion, calling for justice to roll down like waters."],
    ["Obadiah", "Probably soon after 586 BC", "The shortest Old Testament book. It pronounces judgement on Edom, Israel's relative descended from Esau, for gloating over and joining in Jerusalem's destruction, and promises that the kingdom will be the Lord's."],
    ["Jonah, or about Jonah", "Events c. 780–750 BC", "God sends a reluctant prophet to Nineveh, the capital of Israel's brutal enemy Assyria. Jonah flees, is swallowed by a great fish, preaches, and is angry when Nineveh repents and God shows mercy. It reveals God's compassion even for Israel's enemies."],
    ["Micah of Moresheth", "c. 735–700 BC", "A contemporary of Isaiah who spoke to both Israel and Judah. He denounced corrupt leaders and injustice, foretold that the Messiah would be born in Bethlehem, and summed up what God requires: to do justly, love mercy and walk humbly with God."],
    ["Nahum", "c. 660–612 BC", "About a century after Jonah, Nineveh had returned to cruelty. Nahum announces its certain fall, which came in 612 BC, comforting Judah that the Lord is slow to anger but will not leave the guilty unpunished."],
    ["Habakkuk", "c. 609–598 BC", "As Babylon rose, Habakkuk asked God why he allowed injustice and how he could use a wicked nation to punish Judah. God answers that the just shall live by faith, and the book ends in a song of trust even in loss."],
    ["Zephaniah, a descendant of King Hezekiah", "c. 640–620 BC", "Prophesied during King Josiah's reign, probably before his reforms. He warned of the coming day of the Lord against Judah and the nations, then promised that God would rejoice over his restored people with singing."],
    ["Haggai", "520 BC", "The exiles had returned but left the temple unfinished for about 16 years while building their own houses. Haggai urged them to put God first and rebuild, promising that the glory of this house would be greater than the former."],
    ["Zechariah, a priest", "c. 520–480 BC", "A contemporary of Haggai encouraging the returned exiles to finish the temple. His night visions and prophecies look far ahead to the Messiah: the king riding on a donkey, the pierced one, and the Lord reigning over all the earth."],
    ["Malachi", "c. 430 BC", "Written about the time of Nehemiah, when worship had grown careless: blemished sacrifices, broken marriages and withheld tithes. It is the last Old Testament prophet before 400 years of silence, ending with the promise of a messenger to prepare the Lord's way."],
    ["Matthew (Levi), a tax collector and apostle", "c. AD 50–70", "Written mainly for Jewish readers to show that Jesus is the promised Messiah and King, the Son of David who fulfils the Old Testament. It gathers Jesus' teaching into five great sermons, including the Sermon on the Mount."],
    ["John Mark, drawing on Peter's preaching", "c. AD 55–65", "Probably the earliest Gospel, written for Gentile Christians, likely in Rome under persecution. Fast-moving and vivid, it presents Jesus as the Son of God and suffering Servant who came to give his life as a ransom for many."],
    ["Luke, a physician and companion of Paul", "c. AD 60–62", "An orderly, researched account written for Theophilus, a Gentile. Luke stresses Jesus as Saviour of all people, with special care for the poor, women, outsiders and sinners, and records parables such as the Prodigal Son found nowhere else."],
    ["John the apostle, \"the disciple whom Jesus loved\"", "c. AD 85–95", "Written late in the first century so that readers would believe Jesus is the Christ, the Son of God, and have life in his name. Built around seven signs and seven \"I am\" sayings, it gives Jesus' long conversations and the Upper Room teaching."],
    ["Luke", "c. AD 62", "The sequel to Luke's Gospel, covering about AD 30–62. It traces the gospel spreading by the Holy Spirit from Jerusalem to Samaria and on to Rome, through Peter's leadership and Paul's missionary journeys, ending with Paul under arrest in Rome."],
    ["Paul the apostle", "c. AD 57, from Corinth", "Paul's fullest explanation of the gospel, written to a church of Jewish and Gentile believers he had not yet visited. It shows that all have sinned, that people are made right with God by faith in Christ, and how that grace changes everyday life."],
    ["Paul", "c. AD 55, from Ephesus", "Corinth was a wealthy, immoral port city. Paul answers reports of divisions, sexual sin, lawsuits, disorder in worship and doubts about the resurrection, pointing the church to the cross, to love, and to Christ's rising from the dead."],
    ["Paul", "c. AD 56, from Macedonia", "Paul's most personal letter. After painful conflict with the Corinthian church and attacks from rival teachers, he defends his ministry by pointing to weakness, suffering and God's power, and urges generous giving to poor believers in Jerusalem."],
    ["Paul", "c. AD 48–55", "Written to churches in Galatia unsettled by teachers who insisted Gentile Christians must be circumcised and keep the law of Moses. Paul fiercely defends the gospel of grace: we are justified by faith in Christ, free, and called to walk by the Spirit."],
    ["Paul, while imprisoned", "c. AD 60–62, from Rome", "A letter, probably circulated among churches around Ephesus, a major city devoted to the goddess Artemis. It celebrates every spiritual blessing believers have in Christ, the unity of Jew and Gentile in one body, and teaching on the Christian household and spiritual warfare."],
    ["Paul, while imprisoned", "c. AD 61–62, from Rome", "A warm thank-you letter to the church at Philippi, a Roman colony and the first church Paul planted in Europe. Though in chains, Paul writes about joy, the humility of Christ who emptied himself, pressing on, and contentment in all circumstances."],
    ["Paul, while imprisoned", "c. AD 60–62, from Rome", "Written to a church Paul had not visited, threatened by teaching that mixed Christ with philosophy, rituals and angel worship. Paul shows that Christ is supreme over all creation and fully sufficient, so believers need nothing added."],
    ["Paul, with Silas and Timothy", "c. AD 50–51, from Corinth", "Paul had to leave Thessalonica after only a few weeks because of persecution. He encourages the young church to stand firm, live holy lives and take hope in Christ's return, explaining what happens to believers who have died."],
    ["Paul, with Silas and Timothy", "c. AD 51–52, from Corinth", "Some Thessalonians thought the day of the Lord had already come, and some had stopped working. Paul corrects these errors, explains events that must come first, and encourages endurance under persecution."],
    ["Paul", "c. AD 62–64", "Written to Timothy, Paul's young co-worker leading the church in Ephesus. It gives guidance on false teaching, prayer, qualifications for church leaders, care for widows, and the dangers of loving money."],
    ["Paul, in prison awaiting execution", "c. AD 66–67, from Rome", "Paul's last letter, written from a cold Roman cell under Nero. He urges Timothy to guard the gospel, endure hardship as a good soldier and preach the word, and declares that he has fought the good fight and finished the race."],
    ["Paul", "c. AD 62–64", "Written to Titus, left on the island of Crete to set the churches in order. Cretans had a reputation for dishonesty, and Paul stresses appointing godly elders and showing the grace of God through good works."],
    ["Paul, while imprisoned", "c. AD 60–62, from Rome", "A short personal letter to Philemon, a believer in Colossae, about Onesimus, his runaway slave who had become a Christian through Paul. Paul asks Philemon to welcome him back as a brother, a picture of the gospel's power to reconcile."],
    ["Unknown (Paul, Barnabas and Apollos have been suggested)", "c. AD 64–70, before the temple's destruction", "Written to Jewish Christians tempted under pressure to return to Judaism. It shows that Jesus is better than angels, Moses, the priesthood and the sacrifices, and calls readers to hold fast in faith, with the great roll call of faith in chapter 11."],
    ["James, the brother of Jesus and leader of the Jerusalem church", "c. AD 45–50", "Probably the earliest New Testament letter, written to Jewish believers scattered abroad. Like Proverbs, it is intensely practical: real faith shows itself in endurance in trials, care for the poor, controlling the tongue and humble obedience."],
    ["Peter the apostle", "c. AD 62–64, from Rome", "Written to Christians across Asia Minor facing slander and growing persecution. Peter reminds them of their living hope and new identity as God's people, and teaches them to follow Christ's example in suffering."],
    ["Peter the apostle", "c. AD 65–68, shortly before his death", "Peter's farewell, warning against false teachers who denied Christ's return and lived immorally. He urges believers to grow in grace and knowledge and affirms the reliability of Scripture and the certainty of the day of the Lord."],
    ["John the apostle", "c. AD 85–95, probably from Ephesus", "Written after false teachers left the church denying that Jesus came in the flesh. John gives tests of true faith (believing in Jesus, obeying God and loving one another) so that believers may know they have eternal life. God is light and God is love."],
    ["John the apostle (\"the elder\")", "c. AD 85–95", "A short letter to \"the elect lady and her children\", probably a church. It urges walking in truth and love and warns against welcoming travelling teachers who deny that Jesus came in the flesh."],
    ["John the apostle (\"the elder\")", "c. AD 85–95", "A personal note to Gaius commending his hospitality to travelling missionaries, and rebuking Diotrephes, a church leader who loved to be first and refused to welcome them."],
    ["Jude, brother of James and of Jesus", "c. AD 65–80", "Jude meant to write about salvation but instead urgently warns of ungodly people who had crept into the church, turning grace into an excuse for immorality. He calls believers to contend for the faith and keep themselves in God's love."],
    ["John the apostle", "c. AD 95, on the island of Patmos", "Written in exile during the persecution under Emperor Domitian to seven churches in Asia. Through vivid symbolic visions it reveals the risen Christ, God's judgement on evil, and the final victory of the Lamb, ending in the new heaven and new earth."],

  function openNote(v) {
    const { b, c } = S.pos, cid = chId(b, c), d = chData(b, c), ref = label(b, c) + ":" + v, cur = (d && d.notes[v]) || {};
    openSheet("note");

    $("#sheetBody").innerHTML = `<blockquote class="quote">${esc(verseText(b, c, v))}</blockquote>
      <div class="field" id="noteBox"></div>
      <div class="btn-row"><button class="btn" id="noteDone">Done</button><button class="btn danger" id="noteDel">Delete note</button></div>`;
    const update = (patch) => {
      const dd = chData(b, c, true), had = !!dd.notes[v], n = Object.assign({}, dd.notes[v] || {}, patch, { t: Date.now() });
      if (!n.text) delete n.text; if (!n.ink) delete n.ink;
      if (n.text || n.ink) dd.notes[v] = n; else delete dd.notes[v];
      save("ch", cid); if (had !== !!dd.notes[v] && cid === chId(S.pos.b, S.pos.c)) render();
    };
    const ne = noteEditor($("#noteBox"), { label: "My note", text: cur.text, ink: cur.ink, placeholder: "Write your thoughts, a prayer, or what this verse means to you",
      onText: (val) => update({ text: val }), onInk: (ink) => update({ ink }) });
    $("#noteDone").onclick = () => { ne.flush(); closeSheet(); };
    $("#noteDel").onclick = () => { const dd = chData(b, c, true); delete dd.notes[v]; save("ch", cid); render(); closeSheet(); toast("Note deleted"); };
  }

  // ---------- Saved ----------
  function sortedChapters() {
    return Object.keys(DATA.ch).map((id) => [id, ...id.split("-").map(Number)]).filter(([, b, c]) => BOOKS[b] && BOOKS[b][1][c]).sort((x, y) => x[1] - y[1] || x[2] - y[2]);
  }
  function renderSaved(tab) {
    $("#sheetTools").innerHTML = `<div class="seg" id="savedTabs"><button data-t="hls" aria-pressed="${tab === "hls"}">Highlights</button><button data-t="notes" aria-pressed="${tab === "notes"}">Notes</button><button data-t="marks" aria-pressed="${tab === "marks"}">Bookmarks</button></div>`;
    $("#savedTabs").onclick = (e) => { const t = e.target.closest("[data-t]"); if (t) renderSaved(t.dataset.t); };
    let h = "";
    if (tab === "hls") {
      sortedChapters().forEach(([id, b, c]) => DATA.ch[id].hl.slice().sort((x, y) => x.v1 - y.v1 || x.o1 - y.o1).forEach((x) => {
        const q = rangeText(b, c, x);
        h += `<button class="result" data-study="${id}|${x.id}"><b><i class="dot" style="background:var(--hl-${x.c})"></i>${esc(rangeRef(b, c, x))}${x.ctx ? `<span class="pill">Study notes</span>` : ""}${x.note || x.ink ? `<span class="pill">Note</span>` : ""}</b><span>${esc(q.length > 220 ? q.slice(0, 220) + "…" : q)}</span>${x.note ? `<em>${esc(x.note)}</em>` : x.ink ? `<em>Handwritten note</em>` : ""}</button>`;
      }));
      if (!h) h = empty("No highlights yet", "Tap a verse and pick a colour, or turn on the Pencil and sweep the highlighter across the words.");
    }
    if (tab === "notes") {
      sortedChapters().forEach(([id, b, c]) => {
        const d = DATA.ch[id];
        Object.keys(d.notes).map(Number).sort((x, y) => x - y).forEach((v) =>
          h += `<button class="result" data-opennote="${b}.${c}.${v}"><b>${esc(label(b, c))}:${v}</b><em>${esc(d.notes[v].text || "Handwritten note")}</em></button>`);
        d.hl.filter((x) => x.note || x.ink).forEach((x) =>
          h += `<button class="result" data-study="${id}|${x.id}"><b><i class="dot" style="background:var(--hl-${x.c})"></i>${esc(rangeRef(b, c, x))}</b><em>${esc(x.note || "Handwritten note")}</em></button>`);
        const pen = d.ink.filter((s) => s.tool === "pen").length;
        if (pen) h += `<button class="result" data-go="${b}.${c}.0"><b>${esc(label(b, c))}</b><em>Handwritten notes · ${pen} stroke${pen === 1 ? "" : "s"}</em></button>`;
      });
      if (!h) h = empty("No notes yet", "Tap a verse and choose the note icon, or turn on the Pencil and write in the margins.");
    }
    if (tab === "marks") {
      h = S.marks.map((k) => k.split(".").map(Number)).sort((x, y) => x[0] - y[0] || x[1] - y[1] || x[2] - y[2]).map(([b, c, v]) => {
        const t = verseText(b, c, v); return t ? `<button class="result" data-go="${b}.${c}.${v}"><b>${esc(label(b, c))}:${v}</b><span>${esc(t)}</span></button>` : "";
      }).join("") || empty("No bookmarks yet", "Tap any verse while reading, then choose the bookmark icon.");
    }
    $("#sheetBody").innerHTML = h;
  }

  function groupLabel(list) {
    const groups = [];
    list.forEach(([b, c]) => { const g = groups[groups.length - 1]; if (g && g.b === b && g.to === c - 1) g.to = c; else groups.push({ b, from: c, to: c }); });
    return groups.map((g) => (g.b === 18 ? (g.from === g.to ? "Psalm" : "Psalms") : BOOKS[g.b][0]) + " " + (g.from + 1) + (g.to > g.from ? "–" + (g.to + 1) : "")).join(" · ");
  }
  const dayDone = (d, id = planId()) => dayReadings(d, id).every(([b, c]) => planState(id).done[chId(b, c)]);
  function currentDay() { const n = planLength(); for (let d = 1; d <= n; d++) if (!dayDone(d)) return d; return n; }
  function daysComplete() { const n = planLength(); let k = 0; for (let d = 1; d <= n; d++) if (dayDone(d)) k++; return k; }

  async function loadStudy(sid) {
    if (DATA.study[sid]) return DATA.study[sid];
    let v = null;
    if (BASE) { try { const s = await BASE.collection("study").doc(sid).get(); if (s.exists) v = clone(s.data()); } catch (e) {} }
    else v = local.get("kjv2.study." + sid);
    if (v && !DATA.study[sid]) DATA.study[sid] = v;
    return DATA.study[sid] || null;
  }
  const studyDoc = (sid) => (DATA.study[sid] = DATA.study[sid] || {});
  function renderToday() {
    const pid = planId(), def = PLAN_DEFS[pid], n = planLength(), d = Math.min(planDay, n), ps = planState();
    const list = dayReadings(d), started = !!ps.start, done = daysComplete(), sid = studyId(d), title = dayTitle(d);
    let h = `<div class="seg plan-pick" id="planPick">${Object.keys(PLAN_DEFS).map((id) => `<button data-pid="${id}" aria-pressed="${id === pid}">${PLAN_DEFS[id].name}</button>`).join("")}</div>
      <div class="plan-head"><span class="eyebrow">${def.eyebrow}</span>
      <h3>Day ${d} <span style="color:var(--muted);font-size:15px;font-family:var(--f-ui);letter-spacing:0">of ${n}</span></h3>
      ${title ? `<div class="day-title">${esc(title)}</div>` : ""}
      <div class="progress">${groupLabel(list)}</div>
      <div class="progress-bar"><i style="width:${(done / n * 100).toFixed(1)}%"></i></div>
      <div class="progress">${started ? `${done} day${done === 1 ? "" : "s"} complete · started ${new Date(ps.start + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" })}` : esc(def.blurb)}</div></div>`;
    if (!started) h += `<div class="btn-row" style="margin-top:8px"><button class="btn" id="planStart">Start this plan today</button></div>`;
    h += `<div class="plan-nav"><button class="btn quiet" id="dayPrev" ${d <= 1 ? "disabled" : ""}>‹ Day ${Math.max(1, d - 1)}</button><button class="btn quiet" id="dayNext" ${d >= n ? "disabled" : ""}>Day ${Math.min(n, d + 1)} ›</button></div>`;
    h += list.map(([b, c]) => {
      const ok = !!ps.done[chId(b, c)];
      return `<div class="plan-row${ok ? " done" : ""}"><button class="tick" data-toggle="${b}-${c}" aria-label="Mark ${esc(label(b, c))} as ${ok ? "not read" : "read"}"><span class="check">${ICON_CHECK}</span></button>
        <button class="reading" data-go="${b}.${c}.0" data-plan="1"><span>${esc(label(b, c))}</span><em>${BOOKS[b][1][c].length} verses · Read ›</em></button></div>`;
    }).join("");
    h += `<div id="guide"><div class="thinking"><i></i>Loading your study for day ${d}…</div></div><div class="field" id="journalBox"></div>`;
    $("#sheetBody").innerHTML = h;
    $("#planPick").onclick = (e) => {
      const b = e.target.closest("[data-pid]"); if (!b) return;
      S.activePlan = b.dataset.pid; save("state"); planDay = currentDay(); renderToday(); $("#sheetBody").scrollTop = 0;
    };
    const sp = $("#planStart"); if (sp) sp.onclick = () => { ps.start = new Date().toISOString().slice(0, 10); save("state"); renderToday(); toast(def.name + " started. Day 1 is ready."); };
    $("#dayPrev").onclick = () => { planDay = Math.max(1, d - 1); renderToday(); };
    $("#dayNext").onclick = () => { planDay = Math.min(n, d + 1); renderToday(); };
    $("#sheetBody").querySelectorAll("[data-toggle]").forEach((btn) => btn.onclick = (e) => {
      e.stopPropagation(); const k = btn.dataset.toggle;
      if (ps.done[k]) delete ps.done[k]; else ps.done[k] = 1;
      if (!ps.start) ps.start = new Date().toISOString().slice(0, 10);
      save("state"); renderToday();
    });
    loadStudy(sid).then((st) => {
      if (sheetMode !== "today" || planDay !== d || planId() !== pid) return;
      noteEditor($("#journalBox"), { label: `My reflections for day ${d}`, text: st && st.journal, ink: st && st.jink,
        placeholder: "What stood out to you today? What will you take into your day?",
        onText: (v) => { const s2 = studyDoc(sid); if (v) s2.journal = v; else delete s2.journal; save("study", sid); },
        onInk: (ink) => { const s2 = studyDoc(sid); if (ink) s2.jink = ink; else delete s2.jink; save("study", sid); } });
      renderGuide(d, st);
    });
  }
  function soapHTML() {
    return `<div class="study"><section><h3>How to study today</h3><ol>
      <li><b>Scripture.</b> Read today's chapters slowly. Highlight the verse that stands out most.</li>
      <li><b>Observation.</b> Who is speaking, to whom, and what is happening? What does it show about God?</li>
      <li><b>Application.</b> What is one thing to believe, change or do today because of this?</li>
      <li><b>Prayer.</b> Turn what you read into a short prayer.</li></ol></section></div>`;
  }
  function guideHTML(g) {
    return `<div class="study">
      ${g.title ? `<section><h3>Today's study</h3><p style="font-family:var(--f-display);font-size:20px;letter-spacing:.04em">${esc(g.title)}</p></section>` : ""}
      ${g.overview ? `<section><h3>Overview</h3><p>${esc(g.overview)}</p></section>` : ""}
      ${g.background ? `<section><h3>Background</h3><p>${esc(g.background)}</p></section>` : ""}
      ${Array.isArray(g.themes) && g.themes.length ? `<section><h3>Themes</h3><ul>${g.themes.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></section>` : ""}
      ${g.keyVerse && g.keyVerse.ref ? `<section class="expanded"><h3>Key verse</h3><p><button class="xref" data-ref="${esc(g.keyVerse.ref)}">${esc(g.keyVerse.ref)}</button> ${esc(g.keyVerse.why || "")}</p></section>` : ""}
      ${wordsHTML(g.words)}
      ${Array.isArray(g.questions) && g.questions.length ? `<section><h3>Questions to work through</h3><ol>${g.questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ol></section>` : ""}
      ${g.application ? `<section><h3>Living it out</h3><p>${esc(g.application)}</p></section>` : ""}
      ${g.prayer ? `<section><h3>Prayer</h3><p style="font-style:italic">${esc(g.prayer)}</p></section>` : ""}
      <p class="byline">Study guide written by Claude for day ${g.day || ""} and saved to your plan.</p></div>`;
  }
  const guideVisible = (pid, d) => sheetMode === "today" && planDay === d && planId() === pid;
  function renderGuide(d, st) {
    const box = $("#guide"); if (!box) return;
    if (st && st.guide) { box.innerHTML = guideHTML(st.guide); return; }
    if (!SAMPLE) { box.innerHTML = soapHTML(); return; }
    if (pendingGuide.has(studyId(d))) { makeGuide(d); return; }
    box.innerHTML = `<div class="btn-row"><button class="btn" id="mkGuide">Prepare today's study guide</button></div>${soapHTML()}`;
    $("#mkGuide").onclick = () => makeGuide(d);
  }
  function makeGuide(d) {
    const pid = planId(), def = PLAN_DEFS[pid], sid = studyId(d), box = $("#guide"), refs = groupLabel(dayReadings(d)), title = dayTitle(d);
    box.innerHTML = `<div class="thinking"><i></i>Preparing a study guide for ${esc(refs)}…</div>`;
    if (pendingGuide.has(sid)) return;
    pendingGuide.add(sid);
    const prompt = `Write a daily Bible study guide for day ${d} of ${def.focus}.${title ? ` Today's theme: "${title}".` : ""} Today's reading: ${refs}. The reader uses the King James Version and loves the depth of the Amplified Bible.

Reply with only a JSON object of this shape:
{"title": "", "overview": "", "background": "", "themes": ["", "", ""], "keyVerse": {"ref": "", "why": ""}, "words": [{"word": "", "original": "", "meaning": ""}], "questions": ["", "", "", ""], "application": "", "prayer": ""}

- title: a short title for today's study.
- overview: 3-5 sentences on what happens or is taught in today's reading.
- background: 2-3 sentences of historical, cultural or literary context.
- themes: ${def.themes}.
- keyVerse: one verse from today's reading as "Book Chapter:Verse" and why it matters.
- words: 1-2 key words with the original Hebrew or Greek transliterated and the fuller meaning.
- questions: 4 reflection questions that move from understanding the text to personal application.
- application: ${def.apply}.
- prayer: a short prayer of 2-3 sentences.
Draw on broadly held Christian scholarship. Do not quote copyrighted Bible translations. Plain text only, no markdown.`;
    SAMPLE.json(prompt).then((g) => {
      if (!g || typeof g !== "object") throw { code: "invalid_json" };
      g.day = d;
      const s2 = studyDoc(sid); s2.guide = g; save("study", sid);
      if (guideVisible(pid, d)) renderGuide(d, s2);
    }).finally(() => pendingGuide.delete(sid)).catch((e) => {
      if (!guideVisible(pid, d)) return;
      const msg = e && e.code === "not_granted" ? "The study guide needs your permission to use Claude." : e && e.code === "rate_limited" ? "Claude is busy right now. Try again in a minute." : "Couldn't prepare the study guide just now.";
      box.innerHTML = `<p class="hint">${msg}</p>${e && e.code === "not_granted" ? "" : `<button class="btn quiet" id="mkGuide">Try again</button>`}${soapHTML()}`;
      const r = $("#mkGuide"); if (r) r.onclick = () => makeGuide(d);
    });
  }

  // ---------- Settings ----------
  function renderSettings() {
    const seg = (name, opts) => `<div class="seg" data-pref="${name}">${opts.map(([v, l]) => `<button data-v="${v}" aria-pressed="${String(S.prefs[name]) === String(v)}">${l}</button>`).join("")}</div>`;
    $("#sheetBody").innerHTML = `
      <div class="row"><label for="size">Text size</label><input id="size" type="range" min="15" max="32" step="1" value="${S.prefs.size}"></div>
      <p class="sample" style="font-size:${S.prefs.size}px">In the beginning was the Word, and the Word was with God, and the Word was God.</p>
      <div class="row"><label>Layout</label>${seg("layout", [["lines", "Verse by verse"], ["flow", "Paragraph"]])}</div>
      <div class="row"><label>Verse numbers</label>${seg("nums", [[true, "Show"], [false, "Hide"]])}</div>
      <div class="row"><label>Appearance</label>${seg("theme", [["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]])}</div>
      <p class="about"><b>Where your work is kept:</b> ${syncMode === "account"
        ? "highlights, notes, handwriting and your study plan are saved to your Claude account, so they are there whenever you open this Bible signed in."
        : "highlights, notes, handwriting and your study plan are saved on this device."}</p>
      <p class="about">Handwriting sits beside the verse it was written next to. Changing the text size or layout moves the words, so handwriting may no longer line up exactly.</p>
      <p class="about">Bible text: King James Version (1769), public domain. The Amplified Bible is copyrighted by The Lockman Foundation; the links open it on Bible Gateway.</p>`;
    $("#size").oninput = (e) => { S.prefs.size = +e.target.value; $(".sample").style.fontSize = S.prefs.size + "px"; savePrefs(); };
    $("#sheetBody").querySelectorAll("[data-pref]").forEach((g) => g.onclick = (e) => {
      const b = e.target.closest("[data-v]"); if (!b) return;
      const v = b.dataset.v; S.prefs[g.dataset.pref] = v === "true" ? true : v === "false" ? false : v;
      g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); savePrefs();
    });
  }
  function savePrefs() { save("state"); applyTheme(); render(); }

  // ---------- Boot ----------
  Promise.all([
    fetch("kjv.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    initCapabilities(),
  ]).then(async ([data]) => {
    BOOKS = data; TOTAL_CH = BOOKS.reduce((n, b) => n + b[1].length, 0);
    BOOKS.forEach(([, chs], b) => chs.forEach((_, c) => (b < 39 ? OT : NT).push([b, c])));
    await loadData();
    openBook = S.pos.b; S.read[S.pos.b + "." + S.pos.c] = 1;
    applyTheme(); render(); renderRail();
    const cur = $("#rail .book-btn.current"); if (cur) $("#rail").scrollTop = cur.offsetTop - 80;
  }).catch(() => {
    $("#reader").innerHTML = `<p class="loading">The Bible text could not be loaded. Check your connection and reopen the app.</p>`;
  });
  if (window.KJV_PWA && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
